<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
        <!-- <button id="theme-toggle">🌙</button> -->
      <h1>Password Generator</h1>
      <!-- password container -->
      <div class="password-container">
        <input type="text" readonly id="password" />
        <i class="far fa-copy" id="copy-btn" title="Copy to clipboard"></i>
      </div>

      <!-- options -->
      <div class="options">
        <!-- password length-->
        <div class="option">
          <label for="length">Password Length</label>
          <div class="range-container">
            <input type="range" id="length" min="6" max="24" value="12" />
            <span id="length-value">12</span>
          </div>
        </div>

        <!-- include Uppercase -->
        <div class="option">
          <label for="uppercase">Include Uppercase</label>
          <input type="checkbox" id="uppercase" checked />
        </div>

        <!-- include Lowercase -->
        <div class="option">
          <label for="lowercase">Include Lowercase</label>
          <input type="checkbox" id="lowercase" checked />
        </div>

        <!-- include numbers -->
        <div class="option">
          <label for="number">Include Number</label>
          <input type="checkbox" id="number" checked />
        </div>

        <!-- Include symbols -->
        <div class="option">
          <label for="symbol">Include Symbols</label>
          <input type="checkbox" id="symbol" checked />
        </div>
      </div>

      <!-- button -->
      <button id="generate-btn">
        <i class="fas fa-key"></i>
        Generator Password
      </button>

      <!-- passsord container-->
      <div class="strength-container">
        <p>passsord Strength: <span id="strength-label">Medium</span></p>
        <div class="strength-meter">
          <div class="strength-bar"></div>
        </div>
      </div>
      <h2>History:</h2>
      <ul id="history"></ul>
    </div>
    <script src="javascript.js"></script>
  </body>
</html>
